<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Lernmappe</title>
<style>
/* Heft-Stil ohne Heftrand, volle Breite: Papier, roter Rand, Füllerblau, Textmarker. */
:root{
  --paper:#fbfcfe; --ink:#1b2333; --ink-soft:#4b566c; --royal:#2343a6; --royal-soft:#e4e9f8;
  --margin:#e58a8c; --red:#c4302a; --red-soft:#fbe4e2; --green:#1f7a45; --green-soft:#dcf3e3;
  --line:#d3dbe8; --panel:#eef2f9; --card:#ffffff;
  --hl-blue:#bde4ff; --hl-violet:#ddd2ff; --hl-green:#bdf0ad; --hl-yellow:#fff07a;
  --hl-orange:#ffd29c; --hl-pink:#ffc6de; --hl-teal:#aeeee2; --hl-grey:#dfe5ef; --hl-red:#ffcdc7;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --font-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-left:16px;padding-right:16px;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55}
.page{max-width:none;margin:0;padding:24px 8px 64px;min-height:100vh}
.page p{max-width:80ch}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);color:var(--royal)}
h2{font-size:1.3rem;margin:28px 0 12px}
h3{font-size:1.08rem}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--royal)}
:focus-visible{outline:3px solid var(--royal);outline-offset:2px;border-radius:6px}
.leise{color:var(--ink-soft)}
.klein{font-size:.88rem}
.hand{font-family:var(--font-hand);color:var(--royal);font-size:1.35em;line-height:1.1}
mark{background:var(--hl-yellow);color:inherit;padding:0 .12em;border-radius:3px}
u{text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}

/* Kopf */
.kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.etikett{background:var(--card);border:1.5px solid var(--line);border-radius:4px 12px 6px 10px;padding:8px 14px;font-size:.88rem;line-height:1.5;transform:rotate(1deg);box-shadow:0 1px 0 var(--line)}
.etikett b{font-family:var(--font-hand);color:var(--royal);font-size:1.25rem;font-weight:400;margin-left:6px}
.zurueck{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--royal);font-weight:600;text-decoration:none;min-height:44px}

/* Chips & Marker */
.chip{display:inline-block;font-family:var(--font-display);font-weight:600;font-size:.86rem;line-height:1.25;padding:.12em .55em .16em;background:var(--c,var(--panel));border-radius:3px 9px 4px 8px;margin:0 .3rem .3rem 0}
.c-blau{--c:var(--hl-blue)} .c-violett{--c:var(--hl-violet)} .c-gruen{--c:var(--hl-green)} .c-gelb{--c:var(--hl-yellow)}
.c-orange{--c:var(--hl-orange)} .c-pink{--c:var(--hl-pink)} .c-tuerkis{--c:var(--hl-teal)} .c-grau{--c:var(--hl-grey)} .c-rot{--c:var(--hl-red)}

/* Karten / Kacheln */
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.karte{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink);display:grid;gap:6px;align-content:start;text-align:left}
a.karte:hover,button.karte:hover{border-color:var(--royal)}
.karte .titel{font-family:var(--font-display);font-weight:700;font-size:1.12rem}
.balken{height:10px;background:var(--panel);border-radius:999px;overflow:hidden}
.balken span{display:block;height:100%;background:var(--green);border-radius:999px}
.countdown{font-weight:700;color:var(--green)} .countdown.bald{color:var(--red)}
.weiter{background:var(--royal);color:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;margin:18px 0 6px}
.weiter small{color:#cdd7f5;display:block}
.weiter b{font-family:var(--font-display);font-size:1.15rem}
.weiter .pfeil{font-size:1.8rem}
.weiter.wdh{background:#b4530f}
.weiter.wdh small{color:#ffe2c7}
.weiter.nebenbei{background:var(--panel);color:inherit;border:2px dashed var(--royal)}
.weiter.nebenbei small{color:var(--ink-soft)}
.fokus{background:#fff4d6;border-left:6px solid #e0a100;border-radius:10px;padding:10px 14px;margin:14px 0 0;color:#5a4300}

/* Reiter */
.reiter{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;margin:14px 0 6px;scrollbar-width:none;border-bottom:2px dashed var(--line)}
.reiter a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.95rem}
.reiter a.aktiv{background:var(--royal);border-color:var(--royal);color:#fff}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--royal);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;min-height:46px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.hell{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.gut{background:var(--green)}
.btn.breit{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.knoepfe{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* Lernplan */
.schritt{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.schritt input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--green)}
.schritt.fertig{background:var(--green-soft);border-color:transparent}
.schritt.fertig .stitel{text-decoration:line-through;color:var(--ink-soft)}
.schritt.heute{border-color:var(--royal);box-shadow:0 0 0 2px var(--royal-soft)}
.schritt.jetzt{display:block;cursor:default;border:2.5px solid var(--royal);box-shadow:0 4px 18px rgba(35,67,166,.15);padding:16px 18px;margin:14px 0}
.schritt.jetzt .jetzt-etikett{display:inline-block;background:var(--royal);color:#fff;border-radius:999px;padding:2px 12px;font-weight:700;font-size:.85rem;margin-bottom:6px}
.schritt.jetzt .stitel{font-family:var(--font-display);font-size:1.2rem;font-weight:700}
.schritt.jetzt ul{list-style:none;padding:0;margin:10px 0 0}
.schritt.jetzt li{padding:8px 10px;border-radius:10px;margin-bottom:6px;background:var(--panel)}
.schritt.jetzt li.ok{background:var(--green-soft)}
.schritt.jetzt li .warum{display:block;font-size:.88rem;color:var(--ink-soft);margin-left:28px}
.schritt.jetzt li label{cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.schritt.grau{opacity:.5;filter:grayscale(1);cursor:default}
.schritt.grau.fertig{opacity:.6}
.schritt.grau a{pointer-events:none;color:inherit;font-weight:400}
.weitere{margin-top:26px;opacity:.75}
.weitere>summary{cursor:pointer;font-weight:700;color:var(--ink-soft);padding:8px 0}
.weitere .karte{background:var(--panel)}
.schloss-hinweis{color:var(--ink-soft);font-size:.92rem;margin-top:14px}
.stitel{font-weight:700}
.schritt ul{margin:4px 0 0;padding-left:20px}
.schritt li a{font-weight:600}

/* Merkzettel */
.merk{background:var(--card);border:1.5px solid var(--line);border-left:8px solid var(--c,var(--panel));border-radius:6px 14px 14px 6px;padding:14px 16px;margin-bottom:12px}
.merk h3{margin-bottom:6px}
.merk .beispiele{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:1.02rem}
.merk .beispiele span{background:var(--panel);border-radius:6px;padding:2px 8px}

/* Quiz */
.frage{font-family:var(--font-display);font-size:1.3rem;margin:12px 0 14px}
.optionen{display:grid;gap:10px}
.option{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:1.05rem;min-height:56px}
.option:not(:disabled):hover{border-color:var(--royal);background:var(--royal-soft)}
.option:disabled{cursor:default}
.buchst{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel);font-weight:700;font-size:.9rem}
.option.richtig{border-color:var(--green);background:var(--green-soft)} .option.richtig .buchst{background:var(--green);color:#fff}
.option.falsch{border-color:var(--red);background:var(--red-soft)} .option.falsch .buchst{background:var(--red);color:#fff}
.erkl{border-radius:14px;padding:12px 14px;margin:14px 0 4px;background:var(--red-soft)}
.erkl.gut{background:var(--green-soft)}
.ergebnis{text-align:center;padding:20px 0}
.gross{font-family:var(--font-display);font-size:3.4rem;font-weight:800;color:var(--royal);line-height:1}

/* Karteikarten */
.kk{background:none;border:0;padding:0;perspective:1200px;width:100%;height:min(52vh,340px);display:block;margin-top:10px}
.kk .innen{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.kk.um .innen{transform:rotateY(180deg)}
.seite{position:absolute;top:0;right:0;bottom:0;left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;border:1.5px solid var(--line);overflow:auto}
.vorne{background:var(--hl-yellow);font-family:var(--font-display);font-weight:700;font-size:1.35rem}
.hinten{background:var(--card);transform:rotateY(180deg);font-size:1.1rem}
.seite small{font-family:var(--font-body);font-weight:400;font-size:.85rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.kk .innen{transition:none}}

/* Üben */
.aufgabe-box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.aufgabe-box .satz{font-size:1.2rem;margin:4px 0 12px}
.eingabe-zeile{display:flex;gap:8px;flex-wrap:wrap}
.eingabe-zeile input{flex:1;min-width:180px;font:inherit;font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.eingabe-zeile input:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px var(--royal-soft)}
.tipp{background:var(--hl-yellow);border-radius:4px 12px 6px 10px;padding:8px 12px;margin-top:10px}
.loesung{background:var(--green-soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.rueckmeldung{margin-top:10px;font-weight:700}
.rueckmeldung.gut{color:var(--green)} .rueckmeldung.schlecht{color:var(--red)}
.punkte{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 10px}
.punkte i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.punkte i.ok{background:var(--green)} .punkte i.jetzt{background:var(--royal)}

/* Probeklausur */
.probe-aufgabe{border-top:1.5px solid var(--line);padding:14px 0}
.probe-aufgabe .nr{font-family:var(--font-display);font-weight:700;color:var(--royal)}
.probe-aufgabe .pkt{float:right;color:var(--ink-soft);font-size:.9rem}
.linien{margin-top:8px;height:calc(var(--z,3) * 34px);background:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px)}
.uhr{font-family:var(--font-display);font-size:2.2rem;font-weight:800;color:var(--royal)}
.uhr-leiste{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--royal-soft);border:2px solid var(--royal);border-radius:14px;padding:10px 14px;margin:12px 0}
.uhr-leiste .uhr{min-width:4.5ch}
.uhr-leiste .uhr-text{flex:1;min-width:160px;font-weight:600}
.uhr-leiste.knapp{background:var(--hl-yellow);border-color:#9a7400}
.uhr-leiste.vorbei{background:var(--red-soft);border-color:var(--red)}
.uhr-leiste.vorbei .uhr{color:var(--red)}
.profi{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
.profi summary{cursor:pointer;font-weight:700}
.profi ul{margin:8px 0 0;padding-left:20px}
[hidden]{display:none!important}
.schloss{max-width:480px;margin-top:8vh}
.feld{display:grid;gap:6px;margin:14px 0}
.feld span{font-weight:700}
.feld input{font:inherit;font-size:1.05rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.feld input:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px var(--royal-soft)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
.fotos figure{margin:0;position:relative}
.fotos img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);background:var(--panel)}
.fotos button{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(27,35,51,.75);color:#fff;font-weight:700}
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.overlay .innen{max-width:900px;margin:0 auto}
.unsichtbar{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.schloss h1{margin-bottom:12px}
.schloss input{letter-spacing:.04em}
.korrektur{background:var(--card);border:1.5px solid var(--line);border-left:8px solid var(--red);border-radius:6px 14px 14px 6px;padding:14px 16px;margin-bottom:12px}

/* Bericht */
textarea.bericht{width:100%;min-height:300px;font:inherit;font-size:.95rem;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:9;transition:opacity .5s}
/* Meine Ergebnisse */
.ergebnis-knopf{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--green-soft);border:2px solid var(--green);color:var(--ink);border-radius:16px;padding:14px 18px;text-decoration:none;margin:10px 0 6px}
.ergebnis-knopf b{font-family:var(--font-display);font-size:1.12rem;display:block}
.ergebnis-knopf small{color:var(--ink-soft)}
.neu-zahl{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:.88rem;white-space:nowrap;vertical-align:middle}
.wartet-zahl{display:inline-block;background:var(--panel);color:var(--ink-soft);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.88rem;white-space:nowrap}
.korrektur.k-richtig{border-left-color:var(--green)}
.korrektur.k-teilweise{border-left-color:#d99a00}
.korrektur.k-wartet{border-left-color:var(--line);background:var(--panel)}
.korrektur h3{display:inline}
.urteil{display:inline-block;font-weight:700;border-radius:999px;padding:3px 12px;margin:2px 0 10px}
.urteil.richtig{background:var(--green-soft);color:var(--green)}
.urteil.teilweise{background:#fff3c4;color:#7a5400}
.urteil.falsch{background:var(--red-soft);color:var(--red)}
.k-liste{list-style:none;padding:0;margin:4px 0 12px}
.k-liste li{padding:8px 12px;border-radius:10px;margin-bottom:6px;background:var(--panel)}
.k-liste li.ok{background:var(--green-soft)}
.k-liste li.nein{background:var(--red-soft)}
.k-liste s{color:var(--red)}
.am-ort{margin:22px 0 8px}
.am-ort>h3{margin-bottom:10px;color:var(--royal)}
.ort-hinweis{display:inline-block;margin:0 8px 8px 0;background:var(--green-soft);border:2px solid var(--green);border-radius:12px;padding:6px 12px;font-weight:700}
.neu-banner{position:fixed;right:16px;bottom:16px;z-index:15;background:var(--royal);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.feld textarea{font:inherit;font-size:1.05rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-height:110px;resize:vertical}
.feld textarea:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px var(--royal-soft)}
/* Nachrichten mit Papa */
.brief-knopf{background:var(--royal-soft);border-color:var(--royal)}
.briefe{display:grid;gap:10px;margin:14px 0 22px}
.brief{max-width:85%;background:var(--card);border:1.5px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px}
.brief.mir{justify-self:end;background:var(--green-soft);border-color:var(--green);border-radius:16px 16px 4px 16px}
.brief small{display:block;color:var(--ink-soft);font-weight:700;margin-bottom:2px}
.brief img{display:block;max-width:220px;border-radius:10px;margin-top:8px}
.hilfe-zeile{margin-top:36px;text-align:center;font-size:.95rem}
.fuss{margin-top:40px;padding-top:12px;border-top:2px dashed var(--line);font-size:.88rem;color:var(--ink-soft)}

@media print{
  body{background:#fff;padding:0}
  .page{border-left:0;padding:0;max-width:none}
  .nicht-drucken,.reiter,.zurueck,.fuss{display:none!important}
  .probe-aufgabe{break-inside:avoid}
}
@media (max-width:560px){
  body{font-size:16px}
  .page{padding-left:0;padding-right:0}
  .etikett{display:none}
}
</style>
</head>

<script>
/* Notfall-Anzeige: Startet die Lernmappe auf einem Gerät nicht, steht hier nach 8 Sekunden,
   woran es liegt. Absichtlich in alter JavaScript-Schreibweise, damit sie auch auf alten iPads läuft. */
(function () {
  var fehler = [];
  window.onerror = function (msg, quelle, zeile) { fehler.push(String(msg) + (zeile ? " (Zeile " + zeile + ")" : "")); };
  setTimeout(function () {
    var app = document.getElementById("app");
    if (!app || app.getAttribute("data-gestartet")) return;
    var e = function (t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
    app.innerHTML = '<h1>Meine Lernmappe</h1>' +
      '<p>Die Lernmappe konnte auf diesem Gerät leider nicht starten.</p>' +
      '<p>Bitte mach ein Bildschirmfoto von dieser Seite und schick es Papa.</p>' +
      '<p class="leise klein" style="word-break:break-all">Browser: ' + e(navigator.userAgent) +
      '<br>Verschlüsselung verfügbar: ' + (window.crypto && window.crypto.subtle ? "ja" : "nein") +
      '<br>Paket geladen: ' + (window.LM_PAKET ? "ja" : "nein") +
      '<br>Speicher: ' + (function () { try { localStorage.setItem("lm-test", "1"); localStorage.removeItem("lm-test"); return "ja"; } catch (x) { return "nein"; } })() +
      (fehler.length ? '<br>Fehler: ' + e(fehler.join(" | ")) : '') + '</p>';
  }, 8000);
})();
</script>

<script>
"use strict";
// Name und Klasse stehen in den verschlüsselten Inhalten und werden nach dem Entsperren gesetzt.
let KIND = { name: "", klasse: "" };
const SPEICHER = "lernmappe-fortschritt";
const SCHLUESSEL = "lernmappe-schluessel";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = () => $("#app");
const KEIN = { addEventListener() {} };   // Ersatz, wenn ein Knopf auf der Seite fehlt (statt ?. für ältere iPads)

// ---------- Fortschritt (bleibt in diesem Browser gespeichert) ----------
let S = { plan: {}, quiz: {}, karten: {}, uebung: {}, probe: {}, diktat: {}, log: [] };
function ladeFortschritt() {
  try {
    let roh = localStorage.getItem(SPEICHER);
    // Früher hieß der Speicher "lernmappe-<name>". Alten Fortschritt einmalig übernehmen.
    const alt = KIND.name ? "lernmappe-" + KIND.name.toLowerCase() : "";
    if (!roh && alt && localStorage.getItem(alt)) { roh = localStorage.getItem(alt); localStorage.setItem(SPEICHER, roh); localStorage.removeItem(alt); }
    if (roh) S = Object.assign(S, JSON.parse(roh));
  } catch (_) {}
}
function speichern() { try { localStorage.setItem(SPEICHER, JSON.stringify(S)); } catch (_) {} }
function merke(text) { S.log.push({ t: Date.now(), text }); if (S.log.length > 300) S.log = S.log.slice(-300); speichern(); standPlanen(); }

// ---------- Tagesstand: was heute geschafft wurde (für den Abendbericht an die Eltern) ----------
function tag() {
  const d = heuteISO();
  S.tage = S.tage || {};
  if (!S.tage[d]) {
    S.tage[d] = { sekunden: 0, geloest: 0, versuche: 0, fehler: 0, loesungen: 0, quizFragen: 0, quizFalsch: 0, karten: 0, kartenGewusst: 0, diktate: 0, proben: [], fotos: 0, buchseiten: 0, ziele: {}, schritte: [], fehlerListe: [] };
    Object.keys(S.tage).sort().slice(0, -21).forEach((k) => { delete S.tage[k]; });   // nur die letzten 3 Wochen behalten
  }
  return S.tage[d];
}
function fehlerMerken(eintrag) { const tg = tag(); if (tg.fehlerListe.length < 40) tg.fehlerListe.push(eintrag); }
const ohneZeichen = (x) => String(x || "").replace(/\*\*|__|\[\[|\]\]/g, "").replace(/\n/g, " ");
// Zusammenfassung für heute: Tagesziele aus dem Lernplan, Lernzeit, Fehler, neue Korrekturen
function tagesstand() {
  const heute = heuteISO(), tg = tag(), ziele = [], offen = [], korrekturen = [], klausuren = [];
  LM.themen.forEach((t) => {
    (t.lernplan || []).forEach((s, i) => {
      const abgehakt = !!(S.plan[t.id] || {})[i];
      if (s.datum === heute) ziele.push({ thema: `${t.fach}: ${t.titel}`, titel: s.titel, dauer: s.dauer || 20, abgehakt,
        aufgaben: (s.aufgaben || []).map((a, j) => ({ text: ohneZeichen(a.text).slice(0, 160), erledigt: aufgabeStand(t, i, j).ok })) });
      else if (s.datum && s.datum < heute && !abgehakt && (!t.klausur || t.klausur >= heute)) offen.push(`${t.titel}, ${datumKurz(s.datum)}: ${s.titel}`);
    });
    (t.korrekturen || []).forEach((k) => { if (k.datum === heute) korrekturen.push({ titel: k.titel, ergebnis: k.ergebnis || "", punkte: k.punkte || "" }); });
    if (t.klausur && t.klausur >= heute) klausuren.push({ titel: `${t.fach}: ${t.titel}`, datum: t.klausur, tage: tageBis(t.klausur) });
  });
  if (wdhPflicht()) offen.unshift(`🔁 Fehler-Wiederholung: ${wdhHeute().length} Aufgaben noch nicht gemacht`);
  const aktuell = LM.themen.map((t) => { const i = aktuellerSchritt(t); return i < 0 ? null : { thema: `${t.fach}: ${t.titel}`, titel: t.lernplan[i].titel, datum: t.lernplan[i].datum || "", freiAb: wartetBis(t, i) || "" }; }).filter(Boolean);
  const wiederholung = { faellig: wdhFaellig().length, inWiederholung: Object.keys(S.wdh || {}).length, geschafft: S.wdhGeschafft || 0, heuteGemacht: S.wdhErledigt === heute };
  return { aktuell, datum: heute, name: KIND.name, minuten: Math.round(tg.sekunden / 60), tag: tg, ziele, offen, korrekturen, klausuren, wiederholung, gesendetUm: new Date().toLocaleTimeString("de-DE") };
}
let standTimer = null, standSeit = 0;
function standPlanen() {
  if (!(KIND.upload && KIND.upload.url)) return;
  if (!standSeit) standSeit = Date.now();
  clearTimeout(standTimer);
  if (Date.now() - standSeit > 10 * 60000) return standSenden();   // bei langem Lernen spätestens alle 10 Minuten
  standTimer = setTimeout(standSenden, 60000);
}
function standSenden() {
  clearTimeout(standTimer);
  standTimer = null;
  standSeit = 0;
  if (!(KIND.upload && KIND.upload.url) || !S.tage) return;
  try {
    const body = JSON.stringify({ token: KIND.upload.token, art: "stand", datum: heuteISO(), stand: tagesstand(), bericht: bericht() });
    fetch(KIND.upload.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, keepalive: body.length < 60000 }).catch(() => {});
  } catch (_) {}
}
// Lernzeit: zählt, solange das Kind in den letzten 3 Minuten etwas getippt hat oder die Probeklausur-Uhr läuft
let letzteAktion = Date.now();
function lernzeitStarten() {
  ["click", "keydown", "touchstart", "input"].forEach((ev) => document.addEventListener(ev, () => { letzteAktion = Date.now(); }, true));
  setInterval(() => {
    const uhr = $("#leiste") && !$("#leiste").hidden;
    if (document.hidden || !(uhr || Date.now() - letzteAktion < 180000)) return;
    tag().sekunden += 30;
    speichern();
    standPlanen();
  }, 30000);
  document.addEventListener("visibilitychange", () => { if (document.hidden && standTimer) standSenden(); });
  window.addEventListener("pagehide", () => { if (standTimer) standSenden(); });
}

// ---------- Hilfen ----------
const esc = (s) => String(s === undefined || s === null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// Kleine Auszeichnung für Inhalte: **fett**, __unterstrichen__, [[markiert]], Zeilenumbruch
const fmt = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/__(.+?)__/g, "<u>$1</u>")
  .replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>")
  .replace(/\n/g, "<br>");
const heuteISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const tageBis = (iso) => Math.round((new Date(iso + "T12:00:00") - new Date(heuteISO() + "T12:00:00")) / 864e5);
const datumLang = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
const datumKurz = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
function bisText(n) { return n < 0 ? "vorbei" : n === 0 ? "heute!" : n === 1 ? "morgen" : `in ${n} Tagen`; }
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.style.opacity = 0, 2200); setTimeout(() => d.remove(), 2800); }
function mischen(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
const thema = (id) => LM.themen.find((t) => t.id === id);
const breite = (el) => { $$("[data-w]", el).forEach((e) => e.style.width = Math.max(0, Math.min(100, +e.dataset.w)) + "%"); };

function fortschritt(t) {
  const plan = t.lernplan || [];
  const fertig = plan.filter((_, i) => (S.plan[t.id] || {})[i]).length;
  return { fertig, gesamt: plan.length, prozent: plan.length ? Math.round(100 * fertig / plan.length) : 0 };
}
function naechsterSchritt() {
  const heute = heuteISO();
  const aktiv = LM.themen.filter((t) => !t.klausur || tageBis(t.klausur) >= 0);
  aktiv.sort((a, b) => (a.klausur || "9999").localeCompare(b.klausur || "9999"));
  for (const t of aktiv) {
    const i = aktuellerSchritt(t);
    if (i >= 0 && !wartetBis(t, i)) return { t, i, s: t.lernplan[i] };
  }
  return null;
}
// Fokus: die nächste anstehende Klassenarbeit, dazu alle, die höchstens 7 Tage danach kommen.
// Andere Fächer laufen „nebenbei“ (Guidos Wunsch 5.11.2026).
function fokusThemen() {
  const kommend = LM.themen.filter((t) => t.klausur && tageBis(t.klausur) >= 0)
    .sort((a, b) => a.klausur.localeCompare(b.klausur));
  if (!kommend.length) return [];
  const erste = tageBis(kommend[0].klausur);
  return kommend.filter((t) => tageBis(t.klausur) - erste <= 7);
}
function wartendeSchritte() {
  return LM.themen.map((t) => { const i = aktuellerSchritt(t); return i >= 0 && wartetBis(t, i) ? { t, i, s: t.lernplan[i] } : null; }).filter(Boolean);
}
function linkZu(t, ziel) {
  // ziel: "quiz:id", "karten:id", "ueben:id", "merk", "probe"
  const [art, id] = String(ziel).split(":");
  if (art === "merk") return `#/t/${t.id}/merk`;
  if (art === "korrektur") return `#/t/${t.id}/korrektur`;

  if (art === "probe") return id ? `#/t/${t.id}/probe/${id}` : `#/t/${t.id}/probe`;
  return `#/t/${t.id}/${art}/${id}`;
}

const REITER = [["plan", "Lernplan"], ["merk", "Merkzettel"], ["quiz", "Quiz"], ["karten", "Karteikarten"], ["ueben", "Üben"], ["diktat", "Diktate"], ["probe", "Probeklausur"], ["korrektur", "Korrekturen"]];

// ---------- Tag für Tag: immer nur der nächste Lernplan-Schritt ist offen ----------
// Ein Schritt ist fertig, wenn alle Aufgaben erledigt und fehlerfrei sind. Dann schließt das Kind ihn ab,
// und der nächste Schritt wird frei, auch vor seinem Datum. Inhalte späterer Schritte bleiben versteckt.
const fettTitel = (txt) => (String(txt || "").match(/\*\*(.+?)\*\*/g) || []).map((x) => x.slice(2, -2).trim());
function aktuellerSchritt(t) {
  const plan = t.lernplan || [];
  return plan.findIndex((_, i) => !(S.plan[t.id] || {})[i]);   // -1 = alles geschafft
}
// Generalprobe (2 Tage vorher) und letzter Tag vor einer Klassenarbeit gehen erst an ihrem Datum auf,
// auch wenn das Kind vorher mit allem fertig ist. Mit fest: true gilt das für jeden datierten Schritt.
function wartetBis(t, i) {
  const s = (t.lernplan || [])[i];
  if (!s || !s.datum || heuteISO() >= s.datum) return null;
  return s.fest || (t.klausur && s.datum >= plusTage(t.klausur, -2) && s.datum < t.klausur) ? s.datum : null;
}
const wartetText = (t, i) => /generalprobe/i.test(t.lernplan[i].titel)
  ? "Die Generalprobe schreibst du genau zwei Tage vor der Arbeit. Dann ist alles frisch im Kopf."
  : "Dieser Tag ist für kurz vor der Arbeit gedacht. Dann ist alles frisch im Kopf.";
function stufe(t, i) {
  S.stufen = S.stufen || {};
  const k = t.id + "/" + i;
  return S.stufen[k] || (S.stufen[k] = {});
}
// Etwas wurde geschafft (z. B. Quiz ohne Fehler): beim aktuellen Schritt eintragen, wenn er dieses Ziel hat.
function zielGeschafft(t, ziel, zusatz) {
  const i = aktuellerSchritt(t);
  if (!t || i < 0 || wartetBis(t, i)) return;
  (t.lernplan[i].aufgaben || []).forEach((a) => {
    if (a.ziel === ziel || (a.ziel === "probe" && String(ziel).indexOf("probe:") === 0)) stufe(t, i)[a.ziel + (zusatz || "")] = true;
  });
  speichern();
}
function uebungSauber(t, id) {
  const u = (t.uebungen || []).find((x) => x.id === id);
  if (!u) return true;
  const r = S.uebung[t.id + "/" + id] || {};
  return u.aufgaben.every((_, i) => (r[i] || {}).sauber);
}
function zielVorhanden(t, ziel) {
  const [art, id] = String(ziel).split(":");
  if (art === "quiz") return (t.quizze || []).some((x) => x.id === id);
  if (art === "karten") return (t.karten || []).some((x) => x.id === id);
  if (art === "ueben") return (t.uebungen || []).some((x) => x.id === id);
  if (art === "diktat") return (t.diktate || []).some((x) => x.id === id);
  if (art === "probe") return proben(t).length > 0;
  return true;
}
// Ist Aufgabe j von Schritt i erledigt? Liefert { ok, warum } (warum = was noch fehlt)
function aufgabeStand(t, i, j) {
  const a = t.lernplan[i].aufgaben[j], st = stufe(t, i), ziel = a.ziel;
  if (!ziel) return { ok: !!st["frei:" + j], warum: "Hak es ab, wenn du es gemacht hast." };
  if (!zielVorhanden(t, ziel)) return { ok: true };
  const art = String(ziel).split(":")[0], id = String(ziel).split(":")[1];
  if (art === "ueben") {
    const ok = uebungSauber(t, id), r = S.uebung[t.id + "/" + id] || {}, u = t.uebungen.find((x) => x.id === id);
    const offen = u.aufgaben.filter((_, k) => !(r[k] || {}).sauber).length;
    return { ok, warum: `Noch ${offen} ${offen === 1 ? "Aufgabe" : "Aufgaben"} fehlerfrei schaffen.` };
  }
  if (art === "quiz") return { ok: !!st[ziel], warum: "Schaff das Quiz einmal ohne Fehler." };
  if (art === "karten") return { ok: !!st[ziel], warum: "Wisse alle Karten beim ersten Mal." };
  if (art === "merk") return { ok: !!st[ziel], warum: "Lies die Merkzettel." };
  if (art === "korrektur") return { ok: !!st[ziel], warum: "Schau dir deine Korrekturen an." };
  if (art === "fehlercheck") return { ok: !!st[ziel], warum: "Geh alle deine Fehler durch, bis jeder einmal richtig ist." };
  if (art === "diktat") {
    const g = st[ziel + "#geschrieben"], f = st[ziel + "#foto"];
    return { ok: !!(g && f), warum: !g ? "Schreib das Diktat bis zum Ende." : "Lade ein Foto von deinem Diktat hoch." };
  }
  if (art === "probe") {
    const g = st[ziel + "#fertig"], f = st[ziel + "#foto"];
    return { ok: !!(g && f), warum: !g ? "Schreib die Probeklausur mit der Uhr bis „Ich bin fertig“." : "Lade ein Foto von deinem Blatt hoch." };
  }
  return { ok: !!st[ziel], warum: "" };
}
function schrittFertig(t, i) { return (t.lernplan[i].aufgaben || []).every((_, j) => aufgabeStand(t, i, j).ok); }
// Zu welchen Schritten gehört ein Inhalt? Schlüssel wie "quiz:mix", "merk:3" (Index des Merkzettels), "probe:1"
function zuordnung(t) {
  const m = {};
  const dazu = (k, i) => { (m[k] = m[k] || []).push(i); };
  (t.lernplan || []).forEach((s, i) => (s.aufgaben || []).forEach((a) => {
    if (!a.ziel) return;
    if (a.ziel === "merk") {
      const titel = fettTitel(a.text);
      (t.merkzettel || []).forEach((z, k) => { if (titel.indexOf(z.titel) >= 0) dazu("merk:" + k, i); });
    } else if (a.ziel === "probe") proben(t).forEach((_, k) => dazu("probe:" + (k + 1), i));
    else dazu(a.ziel, i);
  }));
  return m;
}
// "jetzt" (aktueller Schritt), "frueher" (schon geschafft), "spaeter" (noch gesperrt) oder "extra" (gehört zu keinem Schritt)
function inhaltStatus(t, key) {
  const schritte = zuordnung(t)[key], cur = aktuellerSchritt(t);
  if (!schritte) return "extra";
  if (cur < 0) return "frueher";
  if (schritte.indexOf(cur) >= 0) return wartetBis(t, cur) ? "spaeter" : "jetzt";
  return schritte.some((i) => i < cur) ? "frueher" : "spaeter";
}

    <div class="knoepfe" style="justify-content:center"><a class="btn" href="#/t/${t.id}/plan">Zum Lernplan</a></div></div>`;
}
function tagAbschliessen(t, i) {
  S.plan[t.id] = S.plan[t.id] || {};
  S.plan[t.id][i] = true;

function seitePlan(t) {
  const f = fortschritt(t), heute = heuteISO(), cur = aktuellerSchritt(t);
  const plan = t.lernplan || [];
  const titelZeile = (s, i) => `${s.datum ? datumKurz(s.datum) + ": " : `Schritt ${i + 1}: `}${esc(s.titel)} <span class="leise klein">· ca. ${s.dauer || 20} Min.</span>`;
  const jetzt = (s, i) => {
    const staende = (s.aufgaben || []).map((_, j) => aufgabeStand(t, i, j)), offen = staende.filter((x) => !x.ok).length;
    return `<div class="schritt jetzt" id="jetzt">
      <span class="jetzt-etikett">Jetzt dran</span>
      <div class="stitel">${titelZeile(s, i)}</div>
      <ul>${(s.aufgaben || []).map((a, j) => {
        const st = staende[j];
        if (!a.ziel) return `<li class="${st.ok ? "ok" : ""}"><label><input type="checkbox" data-frei="${j}" ${st.ok ? "checked" : ""}><span>${fmt(a.text)}</span></label></li>`;
        return `<li class="${st.ok ? "ok" : ""}">${st.ok ? "✅" : "⭕"} <a href="${linkZu(t, a.ziel)}">${fmt(a.text)}</a>${st.ok ? "" : `<span class="warum">${esc(st.warum)}</span>`}</li>`;
      }).join("")}</ul>
      ${offen ? `<p class="leise" style="margin-top:10px">Noch ${offen} ${offen === 1 ? "Aufgabe" : "Aufgaben"}. Wenn alles fehlerfrei ist, schließt du den Tag ab und der nächste wird frei.</p>`
        : wdhPflicht() ? `<div class="erkl"><b>Fast geschafft!</b> Bevor du den Tag abschließt, wiederhol noch kurz deine Fehler von gestern.</div><div class="knoepfe"><a class="btn gut" href="#/wiederholen">🔁 Jetzt wiederholen (${wdhHeute().length})</a></div>`
        : `<div class="knoepfe"><button class="btn gut" id="abschliessen">🎉 Tag abschließen</button></div>`}
    </div>`;
  };
  app().innerHTML = themaKopf(t, "plan") + `
    ${t.einleitung ? `<p>${fmt(t.einleitung)}</p>` : ""}
    <div class="balken"><span data-w="${f.prozent}"></span></div><p class="leise klein">${f.fertig} von ${f.gesamt} Tagen geschafft</p>
    ${cur < 0 && plan.length ? `<p class="hand">Du hast alle Tage geschafft! 🏆</p>` : ""}
    ${plan.map((s, i) => {
      if (i === cur && wartetBis(t, i)) return `<div class="schritt jetzt" id="jetzt"><span class="jetzt-etikett">Ab ${datumKurz(s.datum)}</span>
        <div class="stitel">${titelZeile(s, i)}</div>
        <div class="erkl gut"><b>Du bist dem Plan voraus! 🚀</b><br>Alles davor hast du schon geschafft. ${esc(wartetText(t, i))} Bis dahin kannst du deine Fehler wiederholen, freiwillige Extras machen oder in einem anderen Fach weiterlernen.</div></div>`;
      if (i === cur) return jetzt(s, i);
      const fertig = (S.plan[t.id] || {})[i];
      return `<div class="schritt grau ${fertig ? "fertig" : ""}"><span>${fertig ? "✅" : "🔒"}</span>
        <div><div class="stitel">${titelZeile(s, i)}</div>${fertig ? "" : `<small class="leise">Wird frei, wenn der Tag davor geschafft ist.</small>`}</div></div>`;
    }).join("")}
    <div class="knoepfe nicht-drucken"><a class="btn hell" href="#/foto/${t.id}">📷 Blatt oder Rechnung hochladen</a></div>`;
  $$("[data-frei]").forEach((cb) => cb.addEventListener("change", () => {
    stufe(t, cur)["frei:" + cb.dataset.frei] = cb.checked;
    speichern();
    seitePlan(t);
  }));
  ($("#abschliessen") || KEIN).addEventListener("click", () => {
    tagAbschliessen(t, cur);
    seitePlan(t);
    const naechster = aktuellerSchritt(t);
    if (naechster >= 0) $("#jetzt").insertAdjacentHTML("beforebegin", `<div class="erkl gut"><b>Super, Tag geschafft! 🎉</b><br>Jetzt ist <b>${esc(plan[naechster].titel)}</b> frei. Du kannst gleich weitermachen oder morgen.</div>`);
  });
  breite(app());
}

function seiteMerk(t) {
  tag().ziele.merk = true;
  zielGeschafft(t, "merk");
  const alle = (t.merkzettel || []).map((m, k) => ({ m, st: inhaltStatus(t, "merk:" + k) }));
  const jetzt = alle.filter((x) => x.st === "jetzt"), weitere = alle.filter((x) => x.st === "frueher" || x.st === "extra");
  const gesperrt = alle.filter((x) => x.st === "spaeter").length;
  const zettel = (m) => `
    <section class="merk c-${esc(m.farbe || "grau")}">
      <h3>${esc(m.titel)}</h3>
      ${m.frage ? `<p class="leise"><i>${fmt(m.frage)}</i></p>` : ""}
      <p>${fmt(m.text)}</p>
      ${(m.beispiele || []).length ? `<div class="beispiele">${m.beispiele.map((b) => `<span>${fmt(b)}</span>`).join("")}</div>` : ""}
    </section>`;
  app().innerHTML = themaKopf(t, "merk")
    + (jetzt.length ? jetzt.map((x) => zettel(x.m)).join("") : `<p>Für deinen aktuellen Tag gibt es keinen neuen Merkzettel.</p>`)
    + (weitere.length ? `<details class="weitere"><summary>Weitere Merkzettel zum Nachlesen (${weitere.length})</summary>${weitere.map((x) => zettel(x.m)).join("")}</details>` : "")
    + (gesperrt ? `<p class="schloss-hinweis">🔒 ${gesperrt} weitere Merkzettel ${gesperrt === 1 ? "kommt" : "kommen"} an den nächsten Tagen dran.</p>` : "")
    + `<div class="knoepfe nicht-drucken"><button class="btn hell" id="druck">🖨️ Merkzettel drucken</button></div>`;
  $("#druck").addEventListener("click", () => window.print());
}

function seiteListe(t, art) {
  const name = { quiz: "quizze", karten: "karten", ueben: "uebungen", diktat: "diktate" }[art];
  const alle = t[name] || [];
  const status = (x) => inhaltStatus(t, `${art}:${x.id}`);
  const liste = alle.filter((x) => status(x) === "jetzt"), weitere = alle.filter((x) => status(x) === "frueher" || status(x) === "extra");
  const gesperrt = alle.filter((x) => status(x) === "spaeter").length, cur = aktuellerSchritt(t);
  const karte = (x) => {
    let info = "";
    if (art === "quiz") { const r = S.quiz[t.id + "/" + x.id]; info = `${x.fragen.length} Fragen${r ? ` · Bestes Ergebnis: <b>${r.beste}/${r.total}</b>` : ""}`; }
    if (art === "karten") { const r = S.karten[t.id + "/" + x.id]; info = `${x.karten.length} Karten${r ? ` · ${r.gewusst.length} gewusst` : ""}`; }
    if (art === "ueben") { const r = S.uebung[t.id + "/" + x.id] || {}; const ok = Object.values(r).filter((v) => v.ok).length; info = `${x.aufgaben.length} Aufgaben${ok ? ` · ${ok} gelöst` : ""}${ortInfo(t, `ueben:${x.id}:`, true)}`; }
    if (art === "diktat") { const r = S.diktat[t.id + "/" + x.id]; info = `${x.teile.length} Abschnitte · 🔊 zum Anhören${r ? ` · ${r.mal}× geschrieben` : ""}${ortInfo(t, `diktat:${x.id}`)}`; }
    const fertigZeichen = art === "ueben" && uebungSauber(t, x.id) ? "✅ " : "";
    return `<a class="karte" href="#/t/${t.id}/${art}/${x.id}"><span class="titel">${fertigZeichen}${esc(x.titel)}</span>${x.beschreibung ? `<span class="leise">${fmt(x.beschreibung)}</span>` : ""}<small class="leise">${info}</small></a>`;
  };
  app().innerHTML = themaKopf(t, art) + (cur >= 0 ? `<p class="leise">Heute dran: <b>${esc(t.lernplan[cur].titel)}</b></p>` : "")
    + (liste.length ? `<div class="raster">${liste.map(karte).join("")}</div>` : `<p>Für deinen aktuellen Tag gibt es hier nichts zu tun. Schau in den <a href="#/t/${t.id}/plan">Lernplan</a>.</p>`)
    + (weitere.length ? `<details class="weitere"><summary>Freiwillige Extras und Wiederholung (${weitere.length})</summary><div class="raster">${weitere.map(karte).join("")}</div></details>` : "")
    + (gesperrt ? `<p class="schloss-hinweis">🔒 ${gesperrt} weitere ${gesperrt === 1 ? "kommt" : "kommen"} an den nächsten Tagen dran.</p>` : "");
}

// ---------- Quiz ----------
function seiteQuiz(t, qid) {
  const q = (t.quizze || []).find((x) => x.id === qid);
  if (!q) return seiteListe(t, "quiz");
  const fragen = q.mischen === false ? q.fragen : mischen(q.fragen);
  const antworten = [];
  let nr = 0;
  const frage = () => {
    const f = fragen[nr];
    // Antwortoptionen mischen, richtige Antwort merken
    const opts = mischen(f.optionen.map((o, i) => ({ o, richtig: i === f.richtig })));
    app().innerHTML = themaKopf(t, "quiz") + `
      <p class="leise">${esc(q.titel)} · Frage ${nr + 1} von ${fragen.length}</p>
      <div class="punkte">${fragen.map((_, i) => `<i class="${i < nr ? (antworten[i] ? "ok" : "") : i === nr ? "jetzt" : ""}"></i>`).join("")}</div>
      ${f.thema ? `<span class="chip c-${esc(f.farbe || "grau")}">${esc(f.thema)}</span>` : ""}
      <p class="frage">${fmt(f.frage)}</p>
      <div class="optionen">${opts.map((o, i) => `<button class="option" data-i="${i}"><span class="buchst">${"ABCDEF"[i]}</span><span>${fmt(o.o)}</span></button>`).join("")}</div>
      <div id="erkl"></div>`;
    $$(".option").forEach((b) => b.addEventListener("click", () => {
      const gewaehlt = opts[+b.dataset.i];
      antworten[nr] = gewaehlt.richtig;
      $$(".option").forEach((x) => { x.disabled = true; if (opts[+x.dataset.i].richtig) x.classList.add("richtig"); });
      if (!gewaehlt.richtig) { b.classList.add("falsch"); wdhFehler(t, "quiz", q.id, q.fragen.indexOf(f)); }
      $("#erkl").innerHTML = `<div class="erkl ${gewaehlt.richtig ? "gut" : ""}"><b>${gewaehlt.richtig ? ["Richtig! 🎉", "Genau! ✅", "Stimmt! 👍"][nr % 3] : "Nicht ganz."}</b><br>${fmt(f.erklaerung)}</div>
        <button class="btn breit" id="weiter">${nr + 1 < fragen.length ? "Weiter" : "Ergebnis ansehen"}</button>`;
      $("#weiter").addEventListener("click", () => { nr++; nr < fragen.length ? frage() : ende(); });
      $("#weiter").focus();
    }));
  };
  const ende = () => {
    const richtig = antworten.filter(Boolean).length, total = fragen.length;
    const falsch = [...new Set(fragen.filter((_, i) => !antworten[i]).map((f) => f.thema).filter(Boolean))];
    const key = t.id + "/" + q.id, alt = S.quiz[key];
    S.quiz[key] = { beste: Math.max(richtig, (alt || {}).beste || 0), letzte: richtig, total, falsch, mal: ((alt || {}).mal || 0) + 1 };
    const tg = tag();
    tg.quizFragen += total;
    tg.quizFalsch += total - richtig;
    tg.ziele["quiz:" + q.id] = true;
    if (richtig === total) zielGeschafft(t, "quiz:" + q.id);
    falsch.forEach((x) => fehlerMerken({ wo: `Quiz „${q.titel}“`, thema: x }));
    merke(`${t.titel}: Quiz „${q.titel}“ ${richtig}/${total}${falsch.length ? ` (Fehler bei: ${falsch.join(", ")})` : ""}`);
    const anteil = richtig / total;
    app().innerHTML = themaKopf(t, "quiz") + `<div class="ergebnis">
      <div class="gross">${richtig} / ${total}</div>
      <p class="hand">${anteil === 1 ? "Alles richtig! Großartig! 🏆" : anteil >= .75 ? "Sehr gut gemacht! 🌟" : anteil >= .5 ? "Gut! Mit etwas Übung wird das noch besser. 💪" : "Das war schwer. Schau dir den Merkzettel nochmal an! 🤝"}</p>
      ${falsch.length ? `<p class="leise">Das solltest du noch üben:</p><div>${falsch.map((x) => `<span class="chip c-gelb">${esc(x)}</span>`).join("")}</div>` : ""}
      <div class="knoepfe" style="justify-content:center"><a class="btn" href="#/t/${t.id}/quiz/${q.id}?n=${Date.now()}">Nochmal</a><a class="btn hell" href="#/t/${t.id}/merk">Merkzettel</a><a class="btn hell" href="#/t/${t.id}/plan">Zum Lernplan</a></div>
    </div>`;
  };
  frage();
}

// ---------- Karteikarten ----------
function seiteKarten(t, kid) {
  const k = (t.karten || []).find((x) => x.id === kid);
  if (!k) return seiteListe(t, "karten");
  const key = t.id + "/" + k.id;
  let stapel = mischen(k.karten.map((c, i) => ({ ...c, i })));
  const ersterVersuch = new Set(), gesehen = new Set();
  const zeige = () => {
    if (!stapel.length) return ende();
    const c = stapel[0];
    app().innerHTML = themaKopf(t, "karten") + `
      <p class="leise">${esc(k.titel)} · noch ${stapel.length} Karten</p>
      <button class="kk" id="kk" aria-label="Karte umdrehen"><div class="innen">
        <div class="seite vorne">${fmt(c.vorne)}<small>Erst selbst überlegen, dann antippen</small></div>
        <div class="seite hinten">${fmt(c.hinten)}</div></div></button>
      <div class="knoepfe" id="bew" hidden><button class="btn hell" id="nochmal">↺ Nochmal</button><button class="btn gut" id="gewusst">✓ Wusste ich</button></div>`;
    $("#kk").addEventListener("click", () => { $("#kk").classList.toggle("um"); $("#bew").hidden = false; });
    $("#gewusst").addEventListener("click", () => { if (!gesehen.has(c.i)) ersterVersuch.add(c.i); gesehen.add(c.i); stapel.shift(); zeige(); });
    $("#nochmal").addEventListener("click", () => { if (!gesehen.has(c.i)) wdhFehler(t, "karten", k.id, c.i); gesehen.add(c.i); stapel.push(stapel.shift()); zeige(); });
  };
  const ende = () => {
    S.karten[key] = { gewusst: [...ersterVersuch], total: k.karten.length, mal: ((S.karten[key] || {}).mal || 0) + 1 };
    const tg = tag();
    tg.karten += k.karten.length;
    tg.kartenGewusst += ersterVersuch.size;
    tg.ziele["karten:" + k.id] = true;
    if (ersterVersuch.size === k.karten.length) zielGeschafft(t, "karten:" + k.id);
    merke(`${t.titel}: Karteikarten „${k.titel}“ – ${ersterVersuch.size}/${k.karten.length} beim ersten Mal gewusst`);
    app().innerHTML = themaKopf(t, "karten") + `<div class="ergebnis"><div class="gross">${ersterVersuch.size} / ${k.karten.length}</div>
      <p class="hand">So viele wusstest du beim ersten Mal. Alle Karten sind durch! 🎉</p>
      <div class="knoepfe" style="justify-content:center"><a class="btn" href="#/t/${t.id}/karten/${k.id}?n=${Date.now()}">Nochmal</a><a class="btn hell" href="#/t/${t.id}/plan">Zum Lernplan</a></div></div>`;
  };
  zeige();
}

// ---------- Üben mit Tipps ----------
function normal(s, genau) {
  let x = String(s).trim().replace(/\s+/g, " ").replace(/[.!?]+$/, "").replace(/[„“"]/g, "");
  return genau ? x : x.toLowerCase();
}
function seiteUeben(t, uid) {
  const u = (t.uebungen || []).find((x) => x.id === uid);
  if (!u) return seiteListe(t, "ueben");
  const key = t.id + "/" + u.id;
  S.uebung[key] = S.uebung[key] || {};
  let nr = u.aufgaben.findIndex((_, i) => !(S.uebung[key][i] || {}).ok);
  if (nr < 0) nr = 0;
  const zeige = () => {
    const a = u.aufgaben[nr], st = S.uebung[key][nr] || { tipps: 0, versuche: 0 };
    S.uebung[key][nr] = st;
    const genau = a.genau !== false, ort = `ueben:${u.id}:${nr + 1}`;
    // Neue Korrekturen bei anderen Aufgaben dieser Übung: Knopf, um direkt hinzuspringen
    const andere = u.aufgaben.map((_, i) => i).filter((i) => i !== nr && ergebnisseAm(t, `ueben:${u.id}:${i + 1}`).neu);
    app().innerHTML = themaKopf(t, "ueben") + `
      ${andere.map((i) => `<button class="btn hell ort-hinweis" data-geh="${i}">📬 Neues Ergebnis bei Aufgabe ${i + 1} ›</button>`).join("")}
      <p class="leise">${esc(u.titel)} · Aufgabe ${nr + 1} von ${u.aufgaben.length}</p>
      <div class="punkte">${u.aufgaben.map((_, i) => `<i class="${(S.uebung[key][i] || {}).ok ? "ok" : i === nr ? "jetzt" : ""}"></i>`).join("")}</div>
      ${u.anleitung ? `<p>${fmt(u.anleitung)}</p>` : ""}
      <div class="aufgabe-box">
        <p class="satz">${fmt(a.frage)}</p>
        ${a.sprich ? `<div class="knoepfe" style="margin:0 0 12px"><button class="btn" id="hoer">🔊 Anhören</button></div>` : ""}
        ${a.optionen ? `<div class="optionen">${a.optionen.map((o, i) => `<button class="option" data-o="${esc(o)}"><span class="buchst">${"ABCDEF"[i]}</span><span>${fmt(o)}</span></button>`).join("")}</div>`
          : `<form class="eingabe-zeile" id="ef"><input id="ein" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(a.platzhalter || "Deine Antwort")}" ${st.ok ? `disabled value="${esc(a.antworten[0])}"` : ""}><button class="btn" ${st.ok ? "disabled" : ""}>Prüfen</button></form>`}
        <div id="rm"></div>
        <div id="tipps">${(a.tipps || []).slice(0, st.tipps).map((x, i) => `<div class="tipp"><b>Tipp ${i + 1}:</b> ${fmt(x)}</div>`).join("")}</div>
        <div id="lsg">${st.ok || st.loesung ? `<div class="loesung"><b>Lösung:</b> ${fmt(a.loesung || (a.antworten || [])[0] || "")}</div>` : ""}</div>
      </div>
      <div class="knoepfe">
        ${!st.ok && st.tipps < (a.tipps || []).length ? `<button class="btn hell" id="tipp">💡 Tipp ${st.tipps + 1}</button>` : ""}
        ${!st.ok && !st.loesung && (st.tipps >= (a.tipps || []).length || st.versuche >= 3) ? `<button class="btn hell" id="zeig">Lösung zeigen</button>` : ""}
        ${nr > 0 ? `<button class="btn hell" id="zurueck">‹ Zurück</button>` : ""}
        <button class="btn ${st.ok || st.loesung ? "" : "hell"}" id="vor">${nr + 1 < u.aufgaben.length ? "Nächste ›" : "Fertig"}</button>
        <button class="btn hell" id="foto-auf">📷 Handschrift fotografieren</button>
      </div>
      ${ergebnisBlock(t, ort, `Dein Foto zu Aufgabe ${nr + 1}`)}`;
    $$("[data-geh]").forEach((b) => b.addEventListener("click", () => { nr = +b.dataset.geh; zeige(); window.scrollTo(0, 0); }));
    const pruefe = (wert) => {
      st.versuche++;
      const ok = a.optionen ? (a.antworten || []).includes(wert) : (a.antworten || []).some((x) => normal(x, genau) === normal(wert, genau));
      const tg = tag();
      tg.versuche++;
      tg.ziele["ueben:" + u.id] = true;
      if (ok) tg.geloest++;
      else { tg.fehler++; wdhFehler(t, "ueben", u.id, nr); fehlerMerken({ wo: `${u.titel}, Aufgabe ${nr + 1}`, schrieb: String(wert || "").slice(0, 40), richtig: ohneZeichen((a.antworten || [])[0]) }); }
      if (!ok && wert && !(st.falsch || []).includes(wert)) st.falsch = [...(st.falsch || []), String(wert).slice(0, 40)].slice(-3);
      if (ok) {
        st.ok = true;
        if (st.versuche === 1 && !st.loesung) st.sauber = true;   // beim ersten Versuch, ohne Lösung anzusehen
        merke(`${t.titel}: „${u.titel}“ Aufgabe ${nr + 1} gelöst (${st.tipps} Tipps, ${st.versuche} Versuche)`);
        speichern();
        zeige();
        $("#rm").innerHTML = `<p class="rueckmeldung gut">${["Richtig! 🎉", "Super gemacht! ✅", "Genau so! 👍"][nr % 3]}</p>`;
      } else {
        speichern();
        const naeher = a.fast && a.fast.some((x) => normal(x, genau) === normal(wert, genau));
        $("#rm").innerHTML = `<p class="rueckmeldung schlecht">${naeher ? "Fast! Schau nochmal genau hin." : "Noch nicht ganz. Probier es nochmal" + ((a.tipps || []).length > st.tipps ? " oder hol dir einen Tipp." : ".")}</p>`;
        if (!st.loesung && st.versuche >= 3 && !$("#zeig")) zeige();
      }
    };
    if (a.optionen) $$(".option").forEach((b) => b.addEventListener("click", () => { if (!st.ok) { pruefe(b.dataset.o); if (!st.ok) b.classList.add("falsch"); } }));
    else { $("#ef").addEventListener("submit", (e) => { e.preventDefault(); const v = $("#ein").value; if (v.trim()) pruefe(v); }); if (!st.ok) $("#ein").focus(); }
    ($("#hoer") || KEIN).addEventListener("click", () => sprich(a.sprich, 0.8));
    ($("#tipp") || KEIN).addEventListener("click", () => { st.tipps++; speichern(); zeige(); });
    ($("#zeig") || KEIN).addEventListener("click", () => { st.loesung = true; tag().loesungen++; wdhFehler(t, "ueben", u.id, nr); merke(`${t.titel}: „${u.titel}“ Aufgabe ${nr + 1} Lösung angesehen`); zeige(); });
    ($("#zurueck") || KEIN).addEventListener("click", () => { nr--; zeige(); });
    // Weiter zur nächsten noch offenen Aufgabe (in der Fehler-Runde werden gelöste übersprungen)
    $("#vor").addEventListener("click", () => {
      const naechste = u.aufgaben.findIndex((_, i) => i > nr && !(S.uebung[key][i] || {}).ok);
      if (naechste >= 0) { nr = naechste; zeige(); } else fertig();
    });
    $("#foto-auf").addEventListener("click", () => fotoOverlay(t, `${u.titel}, Aufgabe ${nr + 1}`, ort));
  };
  const fertig = () => {

    return;
  }
  const n = Math.min(Math.max(parseInt(nrText, 10) || 1, 1), liste.length);
  const p = liste[n - 1], key = probeKey(t, n), minuten = p.dauer || 30, dauer = minuten * 60;

      <details class="profi"><summary>🎯 Profi-Tricks für die Klassenarbeit</summary><ul>
        <li>Lies zuerst <b>alle</b> Aufgaben kurz durch.</li>
        <li>Fang mit dem an, was du sicher kannst. Das bringt schnelle Punkte.</li>

      <div class="knoepfe"><button class="btn" id="start">⏱️ ${minuten} Minuten starten</button><button class="btn hell" id="druck">🖨️ Drucken</button><a class="btn hell" href="#/foto/${t.id}/${encodeURIComponent(p.titel)}/probe:${n}">📷 Blatt hochladen</a></div>

    <h2>${esc(p.titel)}</h2>

  const lauf = () => {

  if (offen && !offen.fertig && Date.now() - offen.gestartet < (dauer + 900) * 1000) lauf();
}

// ---------- Meine Ergebnisse: Korrekturen zu den Fotos ----------
// Korrektur-Felder: datum, titel, punkte, text; neu und freiwillig: bezug (Kennung der Sendung, Text oder Liste),
// ergebnis ("richtig" | "teilweise" | "falsch") und aufgaben [{ text, deins, richtig, ok }].
const URTEIL = { richtig: "✅ Alles richtig!", teilweise: "🟡 Zum Teil richtig", falsch: "❌ Noch nicht richtig" };
const nummern = (k) => [].concat(k.bezug || []).map(String);
const korrSchluessel = (t, k) => k.bezug ? "nr:" + nummern(k).join(",") : `${t.id}|${k.datum || ""}|${k.titel || ""}`;
const gesehen = () => S.gesehen || (S.gesehen = {});
function alleKorrekturen() {
  const liste = [];
  LM.themen.forEach((t) => (t.korrekturen || []).forEach((k, i) => liste.push({ t, k, i, key: korrSchluessel(t, k) })));
  return liste.sort((a, b) => String(b.k.datum || "").localeCompare(String(a.k.datum || "")) || b.i - a.i);
}
const neueKorrekturen = () => alleKorrekturen().filter((x) => !gesehen()[x.key]).length;
function wartendeFotos() {
  const fertig = {};
  alleKorrekturen().forEach((x) => nummern(x.k).forEach((n) => { fertig[n] = true; }));
  return (S.gesendet || []).filter((s) => !fertig[s.nr] && Date.now() - s.t < 21 * 864e5).slice().reverse();
}
const wann = (ms) => new Date(ms).toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
function ergebnisKnopf() {
  const neu = neueKorrekturen(), warten = wartendeFotos().length;
  return `<a class="ergebnis-knopf" href="#/ergebnisse"><div><b>📬 Meine Ergebnisse</b><small>Hier siehst du, was richtig war</small></div>
    <span>${neu ? `<span class="neu-zahl">${neu} neu</span>` : warten ? `<span class="wartet-zahl">⏳ ${warten} wird korrigiert</span>` : `<span class="pfeil">›</span>`}</span></a>`;
}
// Korrekturen und wartende Fotos zu einem Ort. Mit offen=true zählt jeder Ort, der mit ort beginnt (ganze Übung).
function ergebnisseAm(t, ort, offen) {
  const passt = (o) => !!o && (offen ? String(o).indexOf(ort) === 0 : o === ort);
  const sendeOrt = {};
  (S.gesendet || []).forEach((s) => { if (s.ort) sendeOrt[s.nr] = s.ort; });
  const korr = (t.korrekturen || []).filter((k) => passt(k.ort) || nummern(k).some((n) => passt(sendeOrt[n])));
  const warten = wartendeFotos().filter((s) => s.tid === t.id && passt(s.ort));
  const neu = korr.filter((k) => !gesehen()[korrSchluessel(t, k)]).length;
  return { korr: korr.slice().reverse(), warten, neu };
}
// Kurzinfo für Listen: „📬 1 neu“ oder „⏳ wird korrigiert“
function ortInfo(t, ort, offen) {
  const e = ergebnisseAm(t, ort, offen);
  return e.neu ? ` · <span class="neu-zahl">📬 ${e.neu} neu</span>` : e.warten.length ? " · ⏳ Foto wird korrigiert" : e.korr.length ? " · 📬 korrigiert" : "";
}
const warteKarte = (s) => `<section class="korrektur k-wartet"><h3>${esc(s.was)}</h3>
  <p class="leise">Geschickt ${wann(s.t)} · ${s.n} ${s.n === 1 ? "Foto" : "Fotos"} · Nr. ${esc(s.nr)}</p><p>Claude schaut sich das an. Schau später nochmal vorbei! 👀</p></section>`;
// Block direkt in der Übung, im Diktat oder in der Probeklausur. Was hier gezeigt wird, gilt als gesehen.
function ergebnisBlock(t, ort, ueberschrift) {
  const e = ergebnisseAm(t, ort), g = gesehen();
  if (!e.korr.length && !e.warten.length) return "";
  const html = `<div class="am-ort"><h3>📬 ${esc(ueberschrift)}</h3>${e.warten.map(warteKarte).join("")}${e.korr.map((k) => korrekturKarte(t, k, !g[korrSchluessel(t, k)], false, true)).join("")}</div>`;
  e.korr.forEach((k) => { g[korrSchluessel(t, k)] = true; });
  speichern();
  return html;
}
function korrekturKarte(t, k, neu, mitFach, ohneUebenKnopf) {
  const urteil = URTEIL[k.ergebnis];
  const zeile = (a) => a.ok
    ? `<li class="ok">✅ ${a.text ? `<b>${fmt(a.text)}</b> ` : ""}${a.deins || a.richtig ? `${fmt(a.deins || a.richtig)} – richtig!` : "Richtig!"}</li>`
    : `<li class="nein">❌ ${a.text ? `<b>${fmt(a.text)}</b><br>` : ""}${a.deins ? `Du hast geschrieben: <s>${fmt(a.deins)}</s><br>` : ""}Richtig ist: <mark>${fmt(a.richtig || "")}</mark></li>`;
  return `<section class="korrektur ${URTEIL[k.ergebnis] ? "k-" + k.ergebnis : ""}">
    ${neu ? `<span class="neu-zahl">Neu</span> ` : ""}<h3>${esc(k.titel)}</h3>
    <p class="leise">${mitFach ? `${esc(t.fach)} · ` : ""}${k.datum ? datumLang(k.datum) : ""}${k.punkte ? ` · <b>${esc(k.punkte)}</b>` : ""}</p>
    ${urteil ? `<div class="urteil ${k.ergebnis}">${urteil}</div>` : ""}
    ${(k.aufgaben || []).length ? `<ul class="k-liste">${k.aufgaben.map(zeile).join("")}</ul>` : ""}
    ${k.text ? `<p>${fmt(k.text)}</p>` : ""}
    ${!ohneUebenKnopf && k.ergebnis && k.ergebnis !== "richtig" && (t.uebungen || []).length ? `<div class="knoepfe"><a class="btn hell" href="#/t/${t.id}/ueben">✏️ Nochmal üben</a></div>` : ""}
  </section>`;
}
function seiteKorrektur(t) {
  tag().ziele.korrektur = true;
  zielGeschafft(t, "korrektur");
  const g = gesehen(), liste = (t.korrekturen || []).slice().reverse();
  app().innerHTML = themaKopf(t, "korrektur") + liste.map((k) => korrekturKarte(t, k, !g[korrSchluessel(t, k)], false)).join("");
  liste.forEach((k) => { g[korrSchluessel(t, k)] = true; });
  speichern();
}
function seiteErgebnisse() {
  const g = gesehen(), warten = wartendeFotos();
  const alle = alleKorrekturen().sort((a, b) => (g[a.key] ? 1 : 0) - (g[b.key] ? 1 : 0));   // Neues zuerst
  app().innerHTML = `<a class="zurueck" href="#/">‹ Meine Lernmappe</a><h1>📬 Meine Ergebnisse</h1>
    <p>Hier siehst du, was Claude zu deinen Fotos sagt: was richtig war und wie es richtig heißt. Meist ist die Korrektur nach ein bis zwei Stunden da. Die Lernmappe schaut von selbst nach, du musst nichts neu öffnen.</p>
    <div class="knoepfe"><button class="btn hell" id="nachsehen">↻ Jetzt nachsehen</button></div>
    ${warten.length ? `<h2>Wird noch korrigiert ⏳</h2>${warten.map(warteKarte).join("")}` : ""}
    <h2>Korrigiert</h2>
    ${alle.length ? alle.map((x) => korrekturKarte(x.t, x.k, !g[x.key], true)).join("")
      : `<p class="leise">Noch keine Korrekturen. Lade ein Foto von deinem Blatt hoch, dann steht hier bald, was richtig war.</p>`}`;
  alle.forEach((x) => { g[x.key] = true; });
  speichern();
  neuBanner(false);
  $("#nachsehen").addEventListener("click", async (e) => {
    const b = e.currentTarget;
    b.disabled = true; b.textContent = "Schaue nach …";
    if (!(await nachNeuemSehen(true))) { b.disabled = false; b.textContent = "↻ Jetzt nachsehen"; toast("Noch nichts Neues. Schau später nochmal!"); }
  });
}

// ---------- Neues von Papa: Inhalte im Hintergrund nachladen, ohne die Lernmappe neu zu öffnen ----------
let SCHLUESSEL_ROH = null, sucheLaeuft = false, letzteSuche = 0;
async function nachNeuemSehen(sofort) {
  if (!SCHLUESSEL_ROH || sucheLaeuft || (!sofort && Date.now() - letzteSuche < 30000)) return false;
  sucheLaeuft = true;
  letzteSuche = Date.now();
  try {
    const antwort = await fetch(`daten/paket.js?stand=${Date.now()}`, { cache: "no-store" });
    if (!antwort.ok) return false;
    const m = (await antwort.text()).match(/LM_PAKET\s*=\s*(\{[\s\S]*\})\s*;/);
    if (!m) return false;
    const neu = JSON.parse(m[1]), alt = window.LM_PAKET;
    if (!neu.daten || neu.iv === alt.iv) return false;
    window.LM_PAKET = neu;
    let text;
    try { text = await entschluesseln(SCHLUESSEL_ROH); } catch (_) { window.LM_PAKET = alt; return false; }
    const vorher = neueKorrekturen();
    if (inhaltAnwenden(text)) { history.replaceState(null, "", location.pathname + location.search + "#/"); route(); return true; }
    auffrischen(neueKorrekturen() > vorher);
    return true;
  } catch (_) { return false; }
  finally { sucheLaeuft = false; }
}
// Ruhige Seiten (Start, Ergebnisse) neu zeichnen. Sonst nicht stören, nur ein Hinweis unten rechts.
function auffrischen(mehrNeue) {
  const seite = location.hash.replace(/^#\/?/, "").split("/")[0];
  const ruhig = !$("#foto-overlay") && (seite === "" || seite === "ergebnisse");
  if (ruhig) { const y = window.pageYOffset; route(); window.scrollTo(0, y); }
  const uhrLaeuft = $("#leiste") && !$("#leiste").hidden;
  if (mehrNeue && seite !== "" && seite !== "ergebnisse" && !uhrLaeuft) neuBanner(true);   // auf der Startseite zeigt der Knopf die Zahl
}
function neuBanner(zeigen, text, ziel) {
  const alt = $("#neu-banner");
  if (alt) alt.remove();
  if (!zeigen) return;
  const b = document.createElement("button");
  b.id = "neu-banner";
  b.className = "neu-banner nicht-drucken";
  b.textContent = text || "📬 Neues Ergebnis da! Ansehen ›";
  b.addEventListener("click", () => { b.remove(); location.hash = ziel || "#/ergebnisse"; });
  document.body.appendChild(b);
}
function nachNeuemAchten() {
  setTimeout(() => nachNeuemSehen(true), 3000);   // gleich nach dem Öffnen: Safari hat das Paket evtl. noch im Zwischenspeicher
  setInterval(() => { if (!document.hidden) nachNeuemSehen(); }, 3 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) nachNeuemSehen(); });
  window.addEventListener("pageshow", (e) => { if (e.persisted) nachNeuemSehen(); });
  window.addEventListener("focus", () => nachNeuemSehen());
  // Nachrichten von Papa: beim Öffnen, alle 3 Minuten und wenn die Lernmappe wieder nach vorn kommt
  setTimeout(briefeLaden, 4000);
  setInterval(() => { if (!document.hidden) briefeLaden(); }, 3 * 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) briefeLaden(); });
}

// ---------- Vorlesen (Sprachausgabe des Geräts, offline, keine KI) ----------
function deutscheStimme() {
  try {
    const v = speechSynthesis.getVoices().filter((x) => /^de/i.test(x.lang));
    return v.find((x) => /premium|enhanced|erweitert/i.test(x.name)) || v.find((x) => /anna|petra|helena|markus|yannick|katja/i.test(x.name)) || v.find((x) => x.lang === "de-DE") || v[0] || null;
  } catch (_) { return null; }
}
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (_) {}
function sprich(text, tempo = 0.85, fertig) {
  if (!("speechSynthesis" in window)) { toast("Dieses Gerät kann leider nicht vorlesen."); return false; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; u.rate = tempo;
  const stimme = deutscheStimme(); if (stimme) u.voice = stimme;
  if (fertig) u.onend = fertig;
  speechSynthesis.speak(u);
  return true;
}
function mitSatzzeichen(t) {
  return t.replace(/„/g, " Anführungszeichen unten, ").replace(/“/g, " Anführungszeichen oben, ")
    .replace(/,/g, " Komma,").replace(/\./g, " Punkt.").replace(/!/g, " Ausrufezeichen!").replace(/\?/g, " Fragezeichen?").replace(/:/g, " Doppelpunkt:");
}

// ---------- Diktat: Das Gerät liest Stück für Stück vor, das Kind schreibt auf Papier ----------
function seiteDiktat(t, did) {

  let nr = -1;   // -1 = Start, 0..n-1 = Abschnitte, n = fertig
  const lies = (txt, tempo) => sprich(opt.zeichen ? mitSatzzeichen(txt) : txt, tempo || opt.tempo);
  const zeige = () => {
    const n = d.teile.length;
    let inhalt = "";
    if (nr < 0) inhalt = `
      <p>Nimm ein Blatt und einen Stift. Das iPad liest dir den Text vor. Hör dir zuerst alles einmal an, ohne zu schreiben. Dann diktiert es dir Stück für Stück. Jedes Stück kannst du so oft hören, wie du willst.</p>

      <details class="profi"><summary>⚙️ Einstellungen</summary>

        <p><label><input type="checkbox" id="zeichen" ${opt.zeichen ? "checked" : ""}> Satzzeichen ansagen (Komma, Punkt, Anführungszeichen …)</label></p></details>`;
    else if (nr < n) inhalt = `
      <p class="leise">Stück ${nr + 1} von ${n}</p>
      <div class="punkte">${d.teile.map((_, i) => `<i class="${i < nr ? "ok" : i === nr ? "jetzt" : ""}"></i>`).join("")}</div>
      <div class="aufgabe-box" style="text-align:center"><p class="gross" style="font-size:2.6rem">🔊</p><p class="leise">Hör gut zu und schreib dann. Sprich dabei leise in Silben mit.</p>
        <div class="knoepfe" style="justify-content:center"><button class="btn" id="nochmal">🔊 Nochmal hören</button></div></div>
      <div class="knoepfe">${nr > 0 ? `<button class="btn hell" id="zurueck">‹ Zurück</button>` : ""}<button class="btn" id="weiter">${nr + 1 < n ? "Weiter ›" : "Fertig ✓"}</button><button class="btn hell" id="foto-auf">📷 Diktat fotografieren</button></div>`;
    else inhalt = `
      <div class="erkl gut"><b>Super, du hast das ganze Diktat geschrieben! 🎉</b><br>Jetzt kommt die Fehlerbrille: Hör den Text noch einmal und lies mit dem Finger Wort für Wort mit. Mach einen Bleistiftpunkt unter jedes Wort, bei dem du unsicher bist, und prüf es mit einer Strategie.</div>
      <div class="knoepfe"><button class="btn hell" id="alles">▶ Ganzen Text noch einmal</button>
        <button class="btn" id="foto-auf">📷 Diktat fotografieren</button>
        <button class="btn hell" id="text">👀 Text zum Vergleichen</button></div>

// ---------- Foto hochladen ----------
// Mit Upload-Adresse (KIND.upload, steht in den verschlüsselten Inhalten) gehen die Fotos direkt in Papas Google Drive.
// Ohne Upload-Adresse oder wenn das Hochladen scheitert: Teilen-Menü (Nachrichten, Mail, AirDrop).
let fotoListe = [];
async function verkleinern(datei, max = 2000, qualitaet = 0.85) {
  const url = URL.createObjectURL(datei);
  try {
    const img = await new Promise((ok, fehler) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fehler; i.src = url; });
    const f = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return (await new Promise((ok) => c.toBlob(ok, "image/jpeg", qualitaet))) || datei;
  } catch (_) { return datei; }
  finally { URL.revokeObjectURL(url); }
}
const blobZuB64 = (blob) => new Promise((ok, fehler) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = fehler; r.readAsDataURL(blob); });
// Jede Sendung bekommt eine Kennung (z. B. „Nr. K7QM2“). Die Korrektur nennt sie unter „bezug“, so findet die App sie wieder.
function neueNr() {
  const z = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let n = "";
  for (let i = 0; i < 5; i++) n += z[Math.floor(Math.random() * z.length)];
  return n;
}
function fotoName(was, i, nr) {
  const d = new Date(), zeit = `${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}`;
  return `${heuteISO()}_${zeit}_${(was || "Foto").replace(/[^\wäöüÄÖÜß-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60)}${nr ? "_Nr-" + nr : ""}_${i + 1}.jpg`;
}
async function fotoHochladen(blob, name, was, ordner) {
  const antwort = await fetch(KIND.upload.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ token: KIND.upload.token, name, beschreibung: was, ordner: ordner || "", bild: await blobZuB64(blob) }) });
  const j = await antwort.json();
  if (!j.ok) throw new Error(j.fehler || "Hochladen hat nicht geklappt");
}
async function fotoTeilen(was, nr, ort) {
  const files = fotoListe.map((f, i) => new File([f.blob], fotoName(was, i, nr), { type: "image/jpeg" }));
  if (!(navigator.canShare && navigator.canShare({ files }))) return "geht-nicht";
  try { await navigator.share({ files, title: "Foto für Papa", text: `${was} (Nr. ${nr}${ort ? `, Ort ${ort}` : ""})` }); return "ok"; }
  catch (e) { return e && e.name === "AbortError" ? "abgebrochen" : "geht-nicht"; }
}

  ($("#foto-zu") || KEIN).addEventListener("click", schliessen);

// ---------- Nachrichten zwischen Valentina und Papa ----------
// Über das Google-Skript: Valentinas Nachricht geht sofort per Mail an Papa und in die Tabelle „Lernmappe Valentina – Nachrichten“.
// Papa schreibt seine Antwort in diese Tabelle (neue Zeile, Spalte „Nachricht“). Die App holt sie alle 3 Minuten ab.
const BRIEF_ARTEN = [["hilfe", "🛠️ Etwas funktioniert nicht"], ["frage", "❓ Ich habe eine Frage"], ["gruss", "👋 Einfach so"]];
let briefeLaufen = false, letzteSeite = "#/";
const briefSchluessel = (b) => `${b.id}|${String(b.text || "").length}|${String(b.text || "").slice(0, 16)}`;
const vonMir = (b) => { const v = String(b.von || "").trim().toLowerCase(); return v === "valentina" || v === String(KIND.name || "").toLowerCase(); };
function neueBriefe() {
  const g = S.briefGelesen || {};
  return (S.briefe || []).filter((b) => !vonMir(b) && !g[briefSchluessel(b)]).length;
}
function briefKnopf() {
  const n = neueBriefe();
  if (!n) return "";
  const letzter = (S.briefe || []).filter((b) => !vonMir(b)).slice(-1)[0] || {};
  return `<a class="ergebnis-knopf brief-knopf" href="#/nachrichten"><div><b>💌 ${n === 1 ? "Neue Nachricht" : n + " neue Nachrichten"} von ${esc(letzter.von || "Papa")}</b><small>Tipp hier, um sie zu lesen</small></div><span class="pfeil">›</span></a>`;
}
function briefZeit(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const uhr = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === new Date().toDateString()) return `heute, ${uhr}`;
  return `${d.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "numeric" })}, ${uhr}`;
}
async function briefeLaden() {
  if (!(KIND.upload && KIND.upload.url) || briefeLaufen) return false;
  briefeLaufen = true;
  try {
    const g = S.briefGelesen || {};
    const gelesen = (S.briefe || []).filter((b) => !vonMir(b) && !b.gelesen && g[briefSchluessel(b)]).map((b) => b.id);
    const antwort = await fetch(KIND.upload.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: KIND.upload.token, art: "briefe", gelesen }) });
    const j = await antwort.json();
    if (!j.ok || !Array.isArray(j.briefe)) return false;
    const vorher = JSON.stringify(S.briefe || []), neuVorher = neueBriefe();
    S.briefe = j.briefe.slice(-60);
    speichern();
    if (JSON.stringify(S.briefe) === vorher) return false;
    briefeAuffrischen(neueBriefe() > neuVorher);
    return true;
  } catch (_) { return false; }
  finally { briefeLaufen = false; }
}
function briefeAuffrischen(mehrNeue) {
  if ($("#foto-overlay")) return;
  const seite = location.hash.replace(/^#\/?/, "").split("/")[0];
  if (seite === "nachrichten") return briefeZeigen();
  if (seite === "") { const y = window.pageYOffset; route(); window.scrollTo(0, y); return; }
  const uhrLaeuft = $("#leiste") && !$("#leiste").hidden;
  if (mehrNeue && !uhrLaeuft) neuBanner(true, "💌 Neue Nachricht von Papa! Lesen ›", "#/nachrichten");
}
function briefeZeigen() {
  const ziel = $("#briefe");
  if (!ziel) return;
  const g = S.briefGelesen = S.briefGelesen || {};
  const liste = (S.briefe || []).slice(-30);
  ziel.innerHTML = liste.length ? liste.map((b) => {
    const mir = vonMir(b), neu = !mir && !g[briefSchluessel(b)];
    return `<div class="brief${mir ? " mir" : ""}"><small>${mir ? "Du" : esc(b.von || "Papa")}${briefZeit(b.datum) ? " · " + briefZeit(b.datum) : ""}${neu ? ` <span class="neu-zahl">Neu</span>` : ""}</small><div>${esc(b.text).replace(/\n/g, "<br>")}</div></div>`;
  }).join("") : `<p class="leise">${KIND.upload && KIND.upload.url ? "Noch keine Nachrichten. Wenn Papa dir schreibt, steht es hier." : "Nachrichten gehen erst, wenn Papa das Hochladen eingerichtet hat."}</p>`;
  let geaendert = false;
  liste.forEach((b) => { if (!vonMir(b) && !g[briefSchluessel(b)]) { g[briefSchluessel(b)] = Date.now(); geaendert = true; } });
  if (geaendert) { speichern(); neuBanner(false); setTimeout(briefeLaden, 1500); }   // Papa sieht in der Tabelle, dass sie es gelesen hat
}
function technikInfo() {
  const zuletzt = (S.log || []).slice(-6).map((l) => `${new Date(l.t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} ${l.text}`).join("\n");
  return [`Seite davor: ${letzteSeite}`, `Online: ${navigator.onLine ? "ja" : "nein"}`, `Paket: ${String((window.LM_PAKET || {}).iv || "").slice(0, 6)}`,
    `Gerät: ${navigator.userAgent}`, "Zuletzt in der App:", zuletzt].join("\n");
}
function seiteNachrichten() {
  const direkt = !!(KIND.upload && KIND.upload.url);
  let art = "", bild = null;
  app().innerHTML = `<a class="zurueck" href="#/">‹ Meine Lernmappe</a>
    <h1>💬 Nachrichten mit Papa</h1>
    <div id="briefe" class="briefe"></div>
    <h2>Papa schreiben</h2>
    <div class="feld"><span>Worum geht es?</span><div class="knoepfe" id="brief-art" style="margin:0">${BRIEF_ARTEN.map(([k, txt]) => `<button class="btn hell" data-art="${k}">${txt}</button>`).join("")}</div></div>
    <label class="feld"><span>Deine Nachricht</span><textarea id="brief-text" rows="4" maxlength="2000" placeholder="Schreib hier, was los ist. Wenn etwas nicht klappt: Wo warst du, und was ist passiert?"></textarea></label>
    <div class="fotos" id="brief-bild"></div>
    <input type="file" id="brief-datei" accept="image/*" class="unsichtbar" tabindex="-1" aria-hidden="true">
    <div class="knoepfe"><button class="btn gut" id="brief-senden">📨 Abschicken</button><button class="btn hell" id="bild-knopf">🖼️ Bildschirmfoto anhängen</button></div>
    <div id="brief-meldung"></div>
    <p class="leise klein">Papa bekommt deine Nachricht sofort als Mail, auch wenn er nicht zu Hause ist. Seine Antwort erscheint hier oben.<br>
    Bildschirmfoto machen: obere Taste und Lauter-Taste gleichzeitig kurz drücken (bei iPads mit runder Home-Taste: obere Taste und Home-Taste).</p>`;
  const meldung = (html) => { $("#brief-meldung").innerHTML = html; };
  const bildZeigen = () => {
    $("#brief-bild").innerHTML = bild ? `<figure><img src="${bild.url}" alt="Angehängtes Bild"><button id="bild-weg" aria-label="Bild entfernen">✕</button></figure>` : "";
    ($("#bild-weg") || KEIN).addEventListener("click", () => { URL.revokeObjectURL(bild.url); bild = null; bildZeigen(); });
    $("#bild-knopf").textContent = bild ? "🖼️ Anderes Bild" : "🖼️ Bildschirmfoto anhängen";
  };
  $$("#brief-art [data-art]").forEach((b) => b.addEventListener("click", () => {
    art = art === b.dataset.art ? "" : b.dataset.art;
    $$("#brief-art [data-art]").forEach((x) => x.classList.toggle("hell", x.dataset.art !== art));
  }));
  $("#bild-knopf").addEventListener("click", () => $("#brief-datei").click());
  $("#brief-datei").addEventListener("change", async (e) => {
    const d = (e.target.files || [])[0];
    e.target.value = "";
    if (!d) return;
    if (bild) URL.revokeObjectURL(bild.url);
    const blob = await verkleinern(d);
    bild = { blob, url: URL.createObjectURL(blob) };
    bildZeigen();
  });
  const leeren = () => { $("#brief-text").value = ""; if (bild) URL.revokeObjectURL(bild.url); bild = null; bildZeigen(); art = ""; $$("#brief-art [data-art]").forEach((x) => x.classList.add("hell")); };
  $("#brief-senden").addEventListener("click", async () => {
    const text = $("#brief-text").value.trim();
    if (!text && !bild) { meldung(`<p class="rueckmeldung schlecht">Schreib erst etwas hinein.</p>`); return; }
    const eintrag = BRIEF_ARTEN.filter((a) => a[0] === art)[0];
    const thema = eintrag ? eintrag[1].replace(/^\S+\s/, "") : "";
    const info = art === "hilfe" ? technikInfo() : "";
    const knopf = $("#brief-senden");
    knopf.disabled = true;

    if (direkt) {
      try {
        const antwort = await fetch(KIND.upload.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ token: KIND.upload.token, art: "nachricht", name: KIND.name, thema, text, info, bild: bild ? await blobZuB64(bild.blob) : "" }) });
        const j = await antwort.json();
        if (!j.ok) throw new Error(j.fehler || "nicht ok");
        if (Array.isArray(j.briefe)) { S.briefe = j.briefe.slice(-60); speichern(); }
        merke(`Nachricht an Papa geschickt${thema ? ` (${thema})` : ""}`);

      <div class="knoepfe">${direkt ? `<button class="btn" id="brief-nochmal">↺ Nochmal versuchen</button>` : ""}<button class="btn hell" id="brief-teilen">📨 Über Nachrichten schicken</button></div>`);

      if (navigator.share) {
        try { await navigator.share(daten); merke("Nachricht an Papa über Teilen geschickt"); leeren(); meldung(`<div class="erkl gut"><b>Abgeschickt! ✅</b></div>`); return; }
        catch (e) { if (e && e.name === "AbortError") return; }

      location.href = `mailto:?subject=${encodeURIComponent("Nachricht von " + (KIND.name || "Valentina"))}&body=${encodeURIComponent(ganz)}`;
