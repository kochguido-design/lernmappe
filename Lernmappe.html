}

// ---------- Bericht für Papa ----------
function bericht() {
  const z = [`Lernmappe ${KIND.name} – Stand ${new Date().toLocaleString("de-DE")}`, ""];
  for (const t of LM.themen) {
    const f = fortschritt(t);
    z.push(`## ${t.fach}: ${t.titel}${t.klausur ? ` (Klausur ${t.klausur})` : ""}`);
    if (f.gesamt) z.push(`Lernplan: ${f.fertig}/${f.gesamt} Schritte erledigt`);
    for (const q of t.quizze || []) { const r = S.quiz[t.id + "/" + q.id]; if (r) z.push(`Quiz „${q.titel}“: zuletzt ${r.letzte}/${r.total}, bestes ${r.beste}/${r.total}, ${r.mal}× gemacht${r.falsch.length ? `; Fehler bei: ${r.falsch.join(", ")}` : ""}`); }
    for (const k of t.karten || []) { const r = S.karten[t.id + "/" + k.id]; if (r) z.push(`Karteikarten „${k.titel}“: ${r.gewusst.length}/${r.total} beim ersten Mal gewusst, ${r.mal}× durchgegangen`); }
    for (const u of t.uebungen || []) {
      const r = S.uebung[t.id + "/" + u.id]; if (!r) continue;
      const geloest = u.aufgaben.filter((_, i) => (r[i] || {}).ok).length;
      const schwer = u.aufgaben.map((a, i) => ({ a, r: r[i] })).filter((x) => x.r && (x.r.tipps >= 2 || x.r.versuche >= 3 || x.r.loesung || (x.r.falsch || []).length))
        .map((x) => `${(x.a.antworten || [])[0] || x.a.frage.replace(/\*\*|__|\[\[|\]\]/g, "").slice(0, 30)}${(x.r.falsch || []).length ? ` (schrieb: ${x.r.falsch.join(" / ")})` : ""}${x.a.strategie ? ` [${x.a.strategie}]` : ""}`);
      z.push(`Übung „${u.titel}“: ${geloest}/${u.aufgaben.length} gelöst${schwer.length ? `; schwer fiel: ${[...new Set(schwer)].join(", ")}` : ""}`);
    }
    for (const d of t.diktate || []) { const r = S.diktat[t.id + "/" + d.id]; if (r) z.push(`Diktat „${d.titel}“: ${r.mal}× geschrieben, zuletzt ${new Date(r.zuletzt).toLocaleDateString("de-DE")}`); }
    proben(t).forEach((p, i) => { const st = probeStatus(t, i + 1); if (st) z.push(`Probeklausur „${p.titel}“: ${st}`); });
    z.push("");
  }
  z.push(`Fehler-Wiederholung: ${Object.keys(S.wdh || {}).length} Aufgaben in der Wiederholung, ${S.wdhGeschafft || 0} schon geschafft${wdhPflicht() ? `, heute ${wdhHeute().length} fällig und noch nicht gemacht` : ""}`, "");
  z.push("Letzte Aktivitäten:");
  S.log.slice(-15).reverse().forEach((l) => z.push(`- ${new Date(l.t).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })} ${l.text}`));
  return z.join("\n");
}
function seiteBericht() {
  const text = bericht();
  app().innerHTML = `<a class="zurueck" href="#/">‹ Meine Lernmappe</a><h1>Fortschritt für Papa</h1>
    <p>Tipp auf <b>An Papa schicken</b> und wähl Nachrichten oder Mail. Papa gibt den Bericht an Claude weiter. Dann passen die nächsten Übungen genau zu dir.</p>
    <textarea class="bericht" id="txt" readonly>${esc(text)}</textarea>
    <div class="knoepfe"><button class="btn" id="schicken">✉️ An Papa schicken</button><button class="btn hell" id="kopie">📋 Kopieren</button><button class="btn hell" id="datei">💾 Als Datei speichern</button></div>`;
  $("#schicken").addEventListener("click", async () => {
    const betreff = `Lernmappe ${KIND.name} – Stand ${new Date().toLocaleDateString("de-DE")}`;
    // Teilen-Menü (Nachrichten, Mail, AirDrop). Ohne Teilen-Menü öffnet sich eine neue Mail.
    if (navigator.share) {
      try { await navigator.share({ title: betreff, text }); merke("Fortschritt an Papa geschickt"); toast("Danke! 📨"); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    merke("Fortschritt per Mail an Papa geöffnet");
    location.href = `mailto:?subject=${encodeURIComponent(betreff)}&body=${encodeURIComponent(text)}`;
  });
  $("#kopie").addEventListener("click", async () => {
    const ta = $("#txt");
    try { await navigator.clipboard.writeText(ta.value); toast("Kopiert!"); }
    catch (_) { ta.focus(); ta.select(); try { document.execCommand("copy"); toast("Kopiert!"); } catch (e) { toast("Bitte mit Cmd+C kopieren"); } }
  });
  $("#datei").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
    a.download = `Lernmappe-Fortschritt-${heuteISO()}.txt`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}

// ---------- Navigation ----------
function route() {
  const seite = location.hash.replace(/^#\/?/, "").split("/")[0];
  if (seite !== "nachrichten") letzteSeite = location.hash || "#/";
  if (seite !== "wiederholen") wdhZurueck = location.hash || "#/";
  seiteZeigen();
  // Unten auf jeder Seite (außer Start und Nachrichten): Hilfe-Link zu Papa
  if (seite && seite !== "nachrichten" && !$("#hilfe-zeile")) app().insertAdjacentHTML("beforeend", `<p class="hilfe-zeile nicht-drucken" id="hilfe-zeile"><a href="#/nachrichten">💬 Klappt etwas nicht? Schreib Papa</a></p>`);
}
function seiteZeigen() {
  clearInterval(uhrTimer);
  try { speechSynthesis.cancel(); } catch (_) {}
  fotoSchliessen();
  const p = location.hash.replace(/^#\/?/, "").split("?")[0].split("/").filter(Boolean);
  window.scrollTo(0, 0);
  if (p[0] === "bericht") return seiteBericht();
  if (p[0] === "ergebnisse") return seiteErgebnisse();
  if (p[0] === "foto") return seiteFoto(p[1], p[2], p[3]);
  if (p[0] === "buch") return seiteBuch();
  if (p[0] === "wiederholen") return seiteWiederholen();
  if (p[0] === "nachrichten") return seiteNachrichten();
  if (p[0] === "t") {
    const t = thema(p[1]);
    if (!t) return seiteStart();
    const tab = p[2] || "plan";
    if (tab === "merk") return seiteMerk(t);
    if (p[3] && ["quiz", "karten", "ueben", "diktat"].indexOf(tab) >= 0 && inhaltStatus(t, `${tab}:${p[3]}`) === "spaeter") return seiteGesperrt(t);
    if (tab === "quiz") return p[3] ? seiteQuiz(t, p[3]) : seiteListe(t, "quiz");
    if (tab === "karten") return p[3] ? seiteKarten(t, p[3]) : seiteListe(t, "karten");
    if (tab === "ueben") return p[3] ? seiteUeben(t, p[3]) : seiteListe(t, "ueben");
    if (tab === "diktat") return p[3] ? seiteDiktat(t, p[3]) : seiteListe(t, "diktat");
    if (tab === "probe") return seiteProbe(t, p[3]);
    if (tab === "korrektur") return seiteKorrektur(t);
    if (tab === "fehlercheck") return inhaltStatus(t, "fehlercheck") === "spaeter" ? seiteGesperrt(t) : seiteWiederholen(t);
    return seitePlan(t);
  }
  seiteStart();
}

// ---------- Entsperren: Inhalte liegen verschlüsselt in daten/paket.js ----------
const b64zuBytes = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
const bytesZuB64 = (b) => btoa(String.fromCharCode(...b));
const normPw = (t) => String(t).toUpperCase().replace(/[^A-Z0-9]/g, "");
async function schluesselAusPasswort(pw) {
  const P = window.LM_PAKET, enc = new TextEncoder();
  const basis = await crypto.subtle.importKey("raw", enc.encode(normPw(pw)), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(P.salz), iterations: P.runden }, basis, 256);
  return new Uint8Array(bits);
}
async function entschluesseln(roh) {
  const P = window.LM_PAKET;
  const key = await crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["decrypt"]);
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64zuBytes(P.iv), additionalData: new TextEncoder().encode("lernmappe-v1") }, key, b64zuBytes(P.daten));
  return new TextDecoder().decode(klar);
}
// Geheimer Link: …/Lernmappe.html#k=PASSWORT. Danach den Link sofort aus der Adresszeile entfernen.
async function linkEntsperren() {
  const m = location.hash.match(/^#k=([A-Za-z0-9-]+)/);
  if (!m) return false;
  history.replaceState(null, "", location.pathname + location.search + "#/");
  let text = null;
  try { text = await mitPasswort(m[1]); } catch (_) { seiteSchloss("Der Link hat nicht funktioniert. Gib das Passwort ein."); return true; }
  loslegen(text);
  return true;
}
function aufLinkWarten() { linkEntsperren(); }
// Führt die entschlüsselten Inhalte aus. Gibt true zurück, wenn der Fortschritt dabei neu gestartet wurde.
function inhaltAnwenden(text) {
  const altThemen = LM.themen, altKind = window.LM_KIND;
  LM.themen = [];
  try { new Function(text)(); }   // legt LM_KIND fest und meldet die Themen mit LM.thema(...) an
  catch (e) { LM.themen = altThemen; window.LM_KIND = altKind; throw e; }
  KIND = window.LM_KIND || KIND;
  fehlerCheckEinbauen();
  // Neustart aus der Ferne: Ist LM_KIND.neustart höher als auf diesem Gerät gespeichert, beginnt der Fortschritt von vorn.
  const neustart = Number(KIND.neustart || 0), vonVorn = (S.neustart || 0) < neustart;
  if (vonVorn) {
    const opt = S.diktatOpt;
    S = { plan: {}, quiz: {}, karten: {}, uebung: {}, probe: {}, diktat: {}, log: [] };
    if (opt) S.diktatOpt = opt;
  }
  S.neustart = neustart;
  speichern();
  return vonVorn;
}
function loslegen(text) {
  window.removeEventListener("hashchange", aufLinkWarten);
  ladeFortschritt();
  inhaltAnwenden(text);
  wdhStart();
  archivStart();
  window.addEventListener("hashchange", route);
  route();
  nachNeuemAchten();
  lernzeitStarten();
}
// Liefert den Klartext oder wirft bei falschem Passwort. Merkt sich den Schlüssel auf diesem Gerät.
async function mitPasswort(pw) {
  const roh = await schluesselAusPasswort(pw);
  const text = await entschluesseln(roh);
  SCHLUESSEL_ROH = roh;
  try { localStorage.setItem(SCHLUESSEL, bytesZuB64(roh)); } catch (_) {}
  return text;
}
function seiteSchloss(meldung) {
  app().innerHTML = `<div class="schloss">
      <p class="hand">Hallo!</p><h1>Meine Lernmappe</h1>
      <p>Gib dein Lernmappen-Passwort ein. Das musst du nur einmal machen.</p>
      <form class="eingabe-zeile" id="pw-form"><input id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passwort" aria-label="Passwort"><button class="btn">🔓 Öffnen</button></form>
      <div id="pw-meldung">${meldung ? `<p class="rueckmeldung schlecht">${esc(meldung)}</p>` : ""}</div>
      <p class="leise klein">Du hast das Passwort nicht? Frag Papa.</p></div>`;
  $("#pw").focus();
  $("#pw-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("#pw").value;
    if (normPw(pw).length < 8) return ($("#pw-meldung").innerHTML = `<p class="rueckmeldung schlecht">Das Passwort ist länger. Schau nochmal genau.</p>`);
    $("#pw-meldung").innerHTML = `<p class="leise">Einen Moment …</p>`;
    let text = null;
    try { text = await mitPasswort(pw); }
    catch (_) { return ($("#pw-meldung").innerHTML = `<p class="rueckmeldung schlecht">Das Passwort stimmt nicht. Probier es nochmal oder frag Papa.</p>`); }
    loslegen(text);
  });
}
(async function start() {
  app().setAttribute("data-gestartet", "1");
  if (!window.LM_PAKET || !window.crypto || !crypto.subtle) {
    app().innerHTML = `<p class="rueckmeldung schlecht">Die Lernmappe konnte nicht geladen werden. Bitte lade die Seite neu.</p>`;
    return;
  }
  if (await linkEntsperren()) return;
  let gespeichert = null;
  try { gespeichert = localStorage.getItem(SCHLUESSEL); } catch (_) {}
  if (gespeichert) {
    let text = null;
    try { const roh = b64zuBytes(gespeichert); text = await entschluesseln(roh); SCHLUESSEL_ROH = roh; }
    catch (_) { try { localStorage.removeItem(SCHLUESSEL); } catch (_) {} }   // z. B. neues Passwort
    if (text !== null) return loslegen(text);
  }
  seiteSchloss();
  window.addEventListener("hashchange", aufLinkWarten);   // geheimer Link im schon offenen Tab
})();
</script>
